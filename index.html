<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- 讓手機正確縮放，沒有這行手機會把頁面縮得很小 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工地每日紀錄</title>

  <style>
    /* ===== CSS：負責外觀（顏色、大小、排版） ===== */

    /* 所有元素的寬度計算包含邊框與內距，排版比較不會跑掉 */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      font-family: "Microsoft JhengHei", sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    /* 內容最寬 600px，手機上會自動填滿螢幕寬度 */
    .container { max-width: 600px; margin: 0 auto; }

    h1 { font-size: 22px; text-align: center; margin: 8px 0 16px; }
    h2 { font-size: 18px; margin: 0 0 12px; }

    /* 白色卡片：表單與每筆紀錄共用 */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    label { display: block; font-weight: bold; margin: 10px 0 4px; }

    /* 輸入欄位字體 16px 以上，iPhone 才不會自動放大畫面 */
    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid #bbb;
      border-radius: 6px;
    }
    textarea { resize: vertical; }

    /* 按鈕夠大，戴手套或單手也好按 */
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 18px;
      color: #fff;
      background: #f08c00;
      border: none;
      border-radius: 8px;
    }

    /* 列表裡每筆紀錄 */
    .record-title { font-weight: bold; font-size: 17px; }
    .record-line { margin: 4px 0; }
    .record-meta { color: #666; font-size: 14px; }

    /* 刪除按鈕：小一點、灰紅色 */
    button.delete {
      width: auto;
      margin-top: 8px;
      padding: 6px 12px;
      font-size: 14px;
      background: #c0392b;
    }

    .empty { text-align: center; color: #888; }

    /* 每個工項一個小框：工項、機具、廠商*人數 */
    .work-row {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .work-row input { margin-bottom: 6px; }
    .work-sub { display: flex; gap: 6px; }
    .work-sub input { margin-bottom: 0; }
    .work-sub .vendor { flex: 2; }
    .work-sub .count { flex: 1; }
    .work-row button.remove {
      width: auto;
      margin: 6px 0 0;
      padding: 6px 12px;
      font-size: 14px;
      background: #c0392b;
    }
    /* 紀錄裡的多個工項分行顯示 */
    .record-line { white-space: pre-line; }

    /* 備份區的按鈕：藍灰色，和送出鈕區分 */
    button.backup { background: #445b78; margin-top: 8px; }
    .hint { color: #666; font-size: 14px; margin: 0 0 4px; }
  </style>
</head>

<body>
  <!-- ===== HTML：負責結構（頁面上有哪些東西） ===== -->
  <div class="container">
    <h1>工地每日紀錄</h1>

    <!-- 表單 -->
    <form id="recordForm" class="card">
      <h2>新增紀錄</h2>

      <label for="date">日期</label>
      <input type="date" id="date" required>

      <label for="project">工程名稱</label>
      <input type="text" id="project" placeholder="例：BC11 工程" required>

      <label for="weather">天氣</label>
      <select id="weather">
        <option>晴</option>
        <option>陰</option>
        <option>雨</option>
        <option>大雨（停工）</option>
      </select>

      <label>施工項目</label>
      <div id="workItems"></div>
      <button type="button" class="backup" id="addWork">＋ 新增工項</button>

      <label for="note">備註</label>
      <textarea id="note" rows="2" placeholder="選填"></textarea>

      <button type="submit">送出</button>
    </form>

    <!-- 紀錄列表（內容由 JavaScript 產生） -->
    <h2>歷史紀錄</h2>
    <div id="recordList"></div>

    <!-- 備份區：資料只存在這個瀏覽器，定期匯出才安全 -->
    <div class="card">
      <h2>備份與匯出</h2>
      <p class="hint">資料只存在這支手機的瀏覽器，清除瀏覽資料就會消失，記得定期備份。</p>
      <button type="button" class="backup" id="exportJson">匯出備份檔</button>
      <button type="button" class="backup" id="importJson">匯入備份檔</button>
      <button type="button" class="backup" id="exportCsv">匯出 Excel 檔（CSV）</button>
      <!-- 隱藏的選檔欄位，按「匯入備份檔」時由程式觸發 -->
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>

  <script>
    /* ===== JavaScript：負責行為（按下送出要做什麼） ===== */

    // localStorage 裡存資料用的名稱
    const STORAGE_KEY = "siteRecords";

    // 抓出頁面上要用到的元素
    const form = document.getElementById("recordForm");
    const listEl = document.getElementById("recordList");

    const workItemsEl = document.getElementById("workItems");

    // 新增一組工項輸入框（工項、機具、廠商*人數）；第一組不給移除，確保至少有一組
    function addWorkRow() {
      const row = document.createElement("div");
      row.className = "work-row";

      const work = document.createElement("input");
      work.type = "text";
      work.className = "f-work";
      work.placeholder = "工項　例：2F 柱筋綁紮";

      const machine = document.createElement("input");
      machine.type = "text";
      machine.className = "f-machine";
      machine.placeholder = "機具　例：吊車（選填）";

      const sub = document.createElement("div");
      sub.className = "work-sub";

      const vendor = document.createElement("input");
      vendor.type = "text";
      vendor.className = "vendor f-vendor";
      vendor.placeholder = "廠商名字";

      const count = document.createElement("input");
      count.type = "number";
      count.className = "count f-count";
      count.min = "0";
      count.inputMode = "numeric";
      count.placeholder = "人數";

      sub.append(vendor, count);
      row.append(work, machine, sub);

      if (workItemsEl.children.length > 0) {
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "移除這個工項";
        remove.addEventListener("click", function () { row.remove(); });
        row.appendChild(remove);
      }

      workItemsEl.appendChild(row);
      return work;
    }

    // 把一筆紀錄的施工內容轉成文字（畫面與 CSV 共用）；舊紀錄只有 work 文字
    function workText(r) {
      if (Array.isArray(r.items)) {
        const many = r.items.length > 1;
        return r.items.map(function (it, i) {
          const lines = [(many ? (i + 1) + ". " : "") + it.work];
          if (it.machine) lines.push("　　機具：" + it.machine);
          if (it.vendor || it.count) lines.push("　　廠商：" + (it.vendor || "") + "*" + (it.count || 0));
          return lines.join("\n");
        }).join("\n");
      }
      const items = String(r.work || "").split("\n").filter(Boolean);
      return items.length > 1
        ? items.map(function (t, i) { return (i + 1) + ". " + t; }).join("\n")
        : (items[0] || "");
    }

    // 清空成只剩一個空白工項欄
    function resetWorkRows() {
      workItemsEl.innerHTML = "";
      addWorkRow();
    }

    document.getElementById("addWork").addEventListener("click", function () {
      addWorkRow().focus();
    });
    resetWorkRows();

    // 從瀏覽器讀出所有紀錄；沒有資料或資料壞掉就回傳空陣列
    function loadRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    // 把紀錄存回瀏覽器（要先轉成文字才能存）
    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    // 把紀錄畫到下方列表
    function render() {
      const records = loadRecords();
      listEl.innerHTML = ""; // 先清空

      if (records.length === 0) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "目前沒有紀錄";
        listEl.appendChild(p);
        return;
      }

      // 日期新的排前面
      records.sort((a, b) => b.date.localeCompare(a.date));

      records.forEach(function (r) {
        const card = document.createElement("div");
        card.className = "card";

        // 用 textContent 塞文字，避免輸入的內容被當成程式碼執行
        const title = document.createElement("div");
        title.className = "record-title";
        title.textContent = r.date + "　" + r.project;

        const meta = document.createElement("div");
        meta.className = "record-meta";
        meta.textContent = "天氣：" + r.weather + "　出工：" + r.workers + " 人";

        const work = document.createElement("div");
        work.className = "record-line";
        // 多行內容（多工項、機具、廠商）從下一行開始顯示
        const text = workText(r);
        work.textContent = "施工項目：" + (text.includes("\n") ? "\n" : "") + text;

        card.append(title, meta, work);

        // 有填備註才顯示
        if (r.note) {
          const note = document.createElement("div");
          note.className = "record-line";
          note.textContent = "備註：" + r.note;
          card.appendChild(note);
        }

        // 刪除按鈕（刪的只是瀏覽器裡的這一筆，會先確認）
        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.textContent = "刪除";
        del.addEventListener("click", function () {
          if (confirm("確定刪除這筆紀錄？")) {
            saveRecords(loadRecords().filter(function (x) { return x.id !== r.id; }));
            render();
          }
        });
        card.appendChild(del);

        listEl.appendChild(card);
      });
    }

    // 按下「送出」時執行
    form.addEventListener("submit", function (event) {
      event.preventDefault(); // 阻止瀏覽器預設的換頁動作

      // 收集有填工項的各組（沒填工項的略過），至少要有一組
      const itemList = Array.from(workItemsEl.querySelectorAll(".work-row"))
        .map(function (row) {
          return {
            work: row.querySelector(".f-work").value.trim(),
            machine: row.querySelector(".f-machine").value.trim(),
            vendor: row.querySelector(".f-vendor").value.trim(),
            count: Number(row.querySelector(".f-count").value) || 0
          };
        })
        .filter(function (it) { return it.work; });
      if (itemList.length === 0) {
        alert("請至少填一個施工項目。");
        return;
      }
      // 出工人數 = 各工項人數加總
      const totalWorkers = itemList.reduce(function (sum, it) { return sum + it.count; }, 0);

      // 把表單內容包成一筆紀錄
      const record = {
        id: Date.now(), // 用時間當編號，刪除時用來辨認
        date: document.getElementById("date").value,
        project: document.getElementById("project").value.trim(),
        weather: document.getElementById("weather").value,
        workers: totalWorkers,
        items: itemList,
        work: workText({ items: itemList }),
        note: document.getElementById("note").value.trim()
      };

      const records = loadRecords();
      records.push(record);
      saveRecords(records);

      // 清空表單，但保留日期與工程名稱，方便連續輸入
      resetWorkRows();
      document.getElementById("note").value = "";

      render();
    });

    // 把文字內容包成檔案並觸發下載
    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 今天的日期字串（YYYY-MM-DD），用在檔名與預設日期
    function todayString() {
      const d = new Date();
      return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
    }

    // 匯出備份檔（JSON）：之後要搬到共用資料庫或換手機都用這個
    document.getElementById("exportJson").addEventListener("click", function () {
      downloadFile("工地紀錄備份_" + todayString() + ".json",
        JSON.stringify(loadRecords(), null, 2), "application/json");
    });

    // 匯出 Excel 可開的 CSV（開頭加 BOM，Excel 才不會中文亂碼）
    document.getElementById("exportCsv").addEventListener("click", function () {
      // 欄位內容含逗號、引號、換行時要用雙引號包起來
      function cell(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
      const rows = [["日期", "工程名稱", "天氣", "出工人數", "施工項目", "備註"]];
      loadRecords()
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach(function (r) {
          rows.push([r.date, r.project, r.weather, r.workers, workText(r), r.note]);
        });
      const csv = "﻿" + rows.map(function (row) { return row.map(cell).join(","); }).join("\r\n");
      downloadFile("工地紀錄_" + todayString() + ".csv", csv, "text/csv");
    });

    // 匯入備份檔：只加入目前沒有的紀錄（用 id 比對），不會覆蓋現有資料
    document.getElementById("importJson").addEventListener("click", function () {
      document.getElementById("importFile").click();
    });
    document.getElementById("importFile").addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const imported = JSON.parse(reader.result);
          if (!Array.isArray(imported)) throw new Error("格式不對");
          const records = loadRecords();
          const existingIds = new Set(records.map(function (r) { return r.id; }));
          let added = 0;
          imported.forEach(function (r) {
            if (r && r.id && r.date && !existingIds.has(r.id)) {
              records.push(r);
              added++;
            }
          });
          saveRecords(records);
          render();
          alert("匯入完成，新增 " + added + " 筆。");
        } catch (e) {
          alert("匯入失敗：這不是正確的備份檔。");
        }
      };
      reader.readAsText(file);
      event.target.value = ""; // 清掉選擇，下次選同一個檔案才會再觸發
    });

    // 日期預設今天（用本地時間，避免差一天）
    const now = new Date();
    document.getElementById("date").value =
      now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0");

    // 頁面一打開就先顯示已存的紀錄
    render();
  </script>
</body>
</html>
